<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="UESTC AutoCheckIn">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="0.55" stop-color="#131a33"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#4f46e5" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#0b1120" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.62" stop-color="#e0e7ff"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fef3c7"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#94a3b8" stroke-width="1" opacity="0.07"/>
    </pattern>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1280" height="340" rx="0" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#grid)"/>
  <rect width="1280" height="340" fill="url(#glow)"/>

  <g fill="#c7d2fe">
    <circle cx="742" cy="52" r="2" opacity="0.7"/>
    <circle cx="812" cy="96" r="1.4" opacity="0.5"/>
    <circle cx="668" cy="118" r="1.6" opacity="0.6"/>
    <circle cx="906" cy="60" r="1.2" opacity="0.45"/>
    <circle cx="1006" cy="40" r="1.8" opacity="0.55"/>
    <circle cx="1184" cy="284" r="1.5" opacity="0.4"/>
    <circle cx="96" cy="292" r="1.4" opacity="0.35"/>
  </g>

  <g transform="translate(1090 158)">
    <circle r="112" fill="#fbbf24" opacity="0.10" filter="url(#soft)"/>
    <path d="M 26 -54 A 62 62 0 1 0 62 26 A 50 50 0 1 1 26 -54 Z" fill="url(#moon)"/>
    <circle cx="46" cy="-22" r="5" fill="#f59e0b" opacity="0.28"/>
    <circle cx="12" cy="34" r="3.4" fill="#f59e0b" opacity="0.22"/>
  </g>

  <g font-family="'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', system-ui, sans-serif">
    <g transform="translate(72 74)">
      <rect x="0" y="0" width="286" height="34" rx="17" fill="#312e81" opacity="0.55" stroke="#6366f1" stroke-opacity="0.35"/>
      <text x="143" y="23" text-anchor="middle" font-size="13" letter-spacing="2.4" fill="#c7d2fe">DOCKER · FASTAPI · SQLITE</text>
    </g>

    <text x="72" y="186" font-size="64" font-weight="700" letter-spacing="-1.2" fill="url(#title)">UESTC AutoCheckIn</text>

    <text x="74" y="236" font-size="27" font-weight="600" fill="#e2e8f0">晚安成电 · 自动打卡</text>

    <text x="74" y="276" font-size="18" fill="#94a3b8">一次部署，从此告别 21:30 的手机闹钟。</text>

    <g font-size="13" fill="#a5b4fc" opacity="0.9">
      <text x="74" y="312">⏱ 21:30–23:00 随机调度</text>
      <text x="260" y="312">🔐 本地加密 · 会话复用</text>
      <text x="456" y="312">🐳 docker compose up -d</text>
    </g>
  </g>

  <rect x="0" y="338" width="1280" height="2" fill="#6366f1" opacity="0.5"/>
</svg>
